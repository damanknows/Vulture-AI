<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/vulture-logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vulture AI — Threat Intelligence & Vulnerability Platform</title>

    <!-- PrimeSec Fonts ─────────────────────────────────────────────────────
         Space Grotesk  → display headings / hero numbers
         JetBrains Mono → code / data / mono chips
         Inter          → body fallback (matches Geist optical sizing)
         ──────────────────────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Override font CSS vars to point at loaded families ────────────────── -->
    <style>
      :root {
        --font-geist-sans:    'Inter';
        --font-geist-mono:    'JetBrains Mono';
        --font-space-grotesk: 'Space Grotesk';
      }
    </style>
  </head>
  <body class="bg-prime-900 text-text-primary antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
