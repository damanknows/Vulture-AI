  <body class="bg-prime-900 text-text-primary antialiased">
    <div id="root"></div>

    <!-- ═══════════════════════════════════════════════════════════════════════
         VULTURE AI — CHAT WIDGET (self-contained, zero impact on React app)
         ═══════════════════════════════════════════════════════════════════════ -->
    <style id="vulture-chat-styles">
      /* ── All styles scoped under #vc- prefix to avoid any collisions ── */
      #vc-toggle {
        position: fixed;
        bottom: 28px;
        right: 28px;
        z-index: 99999;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        border: 1.5px solid rgba(0,245,212,0.35);
        background: linear-gradient(135deg, #0a0f1a 0%, #111827 100%);
        box-shadow: 0 0 24px -4px rgba(0,245,212,0.25), 0 4px 20px rgba(0,0,0,0.5);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
      }
      #vc-toggle:hover {
        transform: scale(1.08);
        box-shadow: 0 0 32px -2px rgba(0,245,212,0.4), 0 4px 24px rgba(0,0,0,0.6);
        border-color: rgba(0,245,212,0.6);
      }
      #vc-toggle svg { width: 28px; height: 28px; color: #00f5d4; transition: transform 0.3s; }
      #vc-toggle.vc-open svg { transform: rotate(90deg); }

      #vc-badge {
        position: absolute;
        top: -2px; right: -2px;
        width: 14px; height: 14px;
        border-radius: 50%;
        background: #22c55e;
        border: 2px solid #0a0f1a;
        animation: vc-pulse 2s infinite;
      }
      @keyframes vc-pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.5); }
        50% { box-shadow: 0 0 0 6px rgba(34,197,94,0); }
      }

      #vc-panel {
        position: fixed;
        bottom: 100px;
        right: 28px;
        z-index: 99998;
        width: 420px;
        max-width: calc(100vw - 32px);
        height: 560px;
        max-height: calc(100vh - 140px);
        border-radius: 16px;
        border: 1px solid rgba(0,245,212,0.15);
        background: linear-gradient(180deg, #0d1320 0%, #0a0f1a 100%);
        box-shadow: 0 8px 48px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,245,212,0.08);
        display: none;
        flex-direction: column;
        overflow: hidden;
        font-family: 'Inter', -apple-system, sans-serif;
        opacity: 0;
        transform: translateY(16px) scale(0.96);
        transition: opacity 0.25s ease, transform 0.25s ease;
      }
      #vc-panel.vc-show {
        display: flex;
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      /* ── Header ── */
      #vc-header {
        padding: 16px 20px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(0,245,212,0.03);
        flex-shrink: 0;
      }
      #vc-header-icon {
        width: 36px; height: 36px;
        border-radius: 10px;
        background: linear-gradient(135deg, rgba(0,245,212,0.15), rgba(0,245,212,0.05));
        border: 1px solid rgba(0,245,212,0.2);
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
      }
      #vc-header-icon svg { width: 18px; height: 18px; color: #00f5d4; }
      #vc-header-info h3 {
        margin: 0; font-size: 14px; font-weight: 600;
        color: #f1f5f9; letter-spacing: -0.01em;
        font-family: 'Space Grotesk', 'Inter', sans-serif;
      }
      #vc-header-info p {
        margin: 2px 0 0; font-size: 11px; color: #64748b;
        font-family: 'JetBrains Mono', monospace;
      }
      #vc-status-dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: #22c55e; display: inline-block;
        margin-right: 4px; vertical-align: middle;
        box-shadow: 0 0 6px rgba(34,197,94,0.5);
      }

      /* ── Messages ── */
      #vc-messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px 16px 8px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        scrollbar-width: thin;
        scrollbar-color: rgba(0,245,212,0.15) transparent;
      }
      #vc-messages::-webkit-scrollbar { width: 4px; }
      #vc-messages::-webkit-scrollbar-track { background: transparent; }
      #vc-messages::-webkit-scrollbar-thumb { background: rgba(0,245,212,0.15); border-radius: 4px; }

      .vc-msg {
        max-width: 88%;
        padding: 10px 14px;
        border-radius: 12px;
        font-size: 13px;
        line-height: 1.55;
        color: #e2e8f0;
        word-wrap: break-word;
        animation: vc-fade-in 0.25s ease;
      }
      @keyframes vc-fade-in {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .vc-msg-bot {
        align-self: flex-start;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.06);
        border-bottom-left-radius: 4px;
      }
      .vc-msg-user {
        align-self: flex-end;
        background: linear-gradient(135deg, rgba(0,245,212,0.12), rgba(0,245,212,0.06));
        border: 1px solid rgba(0,245,212,0.18);
        border-bottom-right-radius: 4px;
        color: #f1f5f9;
      }
      .vc-msg-bot code, .vc-msg-user code {
        background: rgba(0,0,0,0.3);
        padding: 1px 5px;
        border-radius: 4px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
      }
      .vc-msg-bot pre {
        background: rgba(0,0,0,0.35);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 8px;
        padding: 10px 12px;
        overflow-x: auto;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        margin: 8px 0 4px;
        line-height: 1.5;
      }
      .vc-msg-bot strong { color: #00f5d4; font-weight: 600; }
      .vc-msg-bot h1,.vc-msg-bot h2,.vc-msg-bot h3,.vc-msg-bot h4 {
        color: #f1f5f9; margin: 8px 0 4px; font-family: 'Space Grotesk', sans-serif;
      }
      .vc-msg-bot h3 { font-size: 14px; }
      .vc-msg-bot h4 { font-size: 13px; }
      .vc-msg-bot ul, .vc-msg-bot ol { margin: 4px 0; padding-left: 18px; }
      .vc-msg-bot li { margin: 2px 0; }
      .vc-msg-bot blockquote {
        border-left: 3px solid rgba(0,245,212,0.3);
        padding-left: 10px; margin: 6px 0;
        color: #94a3b8; font-style: italic;
      }

      .vc-typing {
        align-self: flex-start;
        display: flex; gap: 5px;
        padding: 12px 16px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 12px;
        border-bottom-left-radius: 4px;
      }
      .vc-typing span {
        width: 6px; height: 6px; border-radius: 50%;
        background: #00f5d4; opacity: 0.4;
        animation: vc-bounce 1.2s infinite;
      }
      .vc-typing span:nth-child(2) { animation-delay: 0.15s; }
      .vc-typing span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes vc-bounce {
        0%,60%,100% { transform: translateY(0); opacity: 0.4; }
        30% { transform: translateY(-6px); opacity: 1; }
      }

      /* ── Welcome chips ── */
      #vc-welcome {
        padding: 0 16px 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .vc-chip {
        padding: 6px 12px;
        border-radius: 20px;
        border: 1px solid rgba(0,245,212,0.15);
        background: rgba(0,245,212,0.04);
        color: #94a3b8;
        font-size: 11.5px;
        cursor: pointer;
        transition: all 0.2s;
        font-family: 'Inter', sans-serif;
      }
      .vc-chip:hover {
        background: rgba(0,245,212,0.1);
        border-color: rgba(0,245,212,0.3);
        color: #00f5d4;
      }

      /* ── Input ── */
      #vc-input-area {
        padding: 12px 16px 16px;
        border-top: 1px solid rgba(255,255,255,0.06);
        display: flex;
        gap: 8px;
        align-items: center;
        flex-shrink: 0;
        background: rgba(0,0,0,0.15);
      }
      #vc-input {
        flex: 1;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 10px;
        padding: 10px 14px;
        color: #f1f5f9;
        font-size: 13px;
        font-family: 'Inter', sans-serif;
        outline: none;
        transition: border-color 0.2s;
      }
      #vc-input::placeholder { color: #475569; }
      #vc-input:focus { border-color: rgba(0,245,212,0.35); }
      #vc-input:disabled { opacity: 0.5; }

      #vc-send {
        width: 38px; height: 38px;
        border-radius: 10px;
        border: 1px solid rgba(0,245,212,0.2);
        background: linear-gradient(135deg, rgba(0,245,212,0.12), rgba(0,245,212,0.06));
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: all 0.2s;
        flex-shrink: 0;
      }
      #vc-send:hover { background: rgba(0,245,212,0.2); border-color: rgba(0,245,212,0.4); }
      #vc-send:disabled { opacity: 0.3; cursor: not-allowed; }
      #vc-send svg { width: 16px; height: 16px; color: #00f5d4; }

      /* ── Responsive ── */
      @media (max-width: 480px) {
        #vc-panel {
          right: 8px;
          bottom: 80px;
          width: calc(100vw - 16px);
          height: calc(100vh - 100px);
          border-radius: 12px;
        }
        #vc-toggle { bottom: 16px; right: 16px; width: 52px; height: 52px; }
      }
    </style>

    <!-- Chat toggle button -->
    <button id="vc-toggle" aria-label="Open Vulture AI Chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <span id="vc-badge"></span>
    </button>

    <!-- Chat panel -->
    <div id="vc-panel">
      <div id="vc-header">
        <div id="vc-header-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2 4 5v7c0 5 3.5 9 8 10 4.5-1 8-5 8-10V5l-8-3z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
        <div id="vc-header-info">
          <h3>Vulture AI Assistant</h3>
          <p><span id="vc-status-dot"></span><span id="vc-status-text">Online</span></p>

      </div>

      <div id="vc-messages">
        <div class="vc-msg vc-msg-bot">
          👋 Hi! I'm your <strong>Vulture AI</strong> security assistant. Ask me about vulnerabilities, scan results, or threat intelligence.

      </div>

      <div id="vc-welcome">
        <span class="vc-chip" data-q="Summarize the scan results">📊 Scan summary</span>
        <span class="vc-chip" data-q="What are the critical vulnerabilities?">🔴 Critical findings</span>

      </div>

        </button>
      </div>
    </div>

    <!-- Chat logic (self-contained, no dependencies) -->
    <script id="vulture-chat-script">
    (function() {
      'use strict';

      const CHAT_API_URL = '/api/chat';
      const ANALYZE_API_URL = '/api/analyze';

      const toggle   = document.getElementById('vc-toggle');
      const panel    = document.getElementById('vc-panel');
      const messages = document.getElementById('vc-messages');
      const input    = document.getElementById('vc-input');
      const sendBtn  = document.getElementById('vc-send');
      const welcome  = document.getElementById('vc-welcome');
      const badge    = document.getElementById('vc-badge');
      const statusText = document.getElementById('vc-status-text');

      let chatHistory = [];
      let isLoading = false;
      let isOpen = false;

      // ── Toggle panel ──
      toggle.addEventListener('click', function() {
        isOpen = !isOpen;
        if (isOpen) {
          panel.style.display = 'flex';
          requestAnimationFrame(function() {
            requestAnimationFrame(function() {
              panel.classList.add('vc-show');
            });
          });
          toggle.classList.add('vc-open');
          badge.style.display = 'none';
          input.focus();
        } else {
          panel.classList.remove('vc-show');
          toggle.classList.remove('vc-open');
          setTimeout(function() {
            if (!isOpen) panel.style.display = 'none';
          }, 250);
        }
      });

      // ── Send on Enter ──
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      });
      sendBtn.addEventListener('click', handleSend);

      // ── Suggestion chips ──
      document.querySelectorAll('.vc-chip').forEach(function(chip) {
        chip.addEventListener('click', function() {
          var q = chip.getAttribute('data-q');
          if (q) sendMessage(q);
        });
      });

      function handleSend() {
        var text = input.value.trim();
        if (!text || isLoading) return;
        input.value = '';
        sendMessage(text);
      }

      async function sendMessage(text) {
        // Hide welcome chips after first message
        if (welcome) welcome.style.display = 'none';

        appendMessage('user', text);
        chatHistory.push({ role: 'user', content: text });

        setLoading(true);

        try {
          var res = await fetch(CHAT_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question: text, history: chatHistory })
          });
          var data = await res.json();
          var reply = data.reply || data.error || 'No response generated.';

          appendMessage('bot', reply);
          chatHistory.push({ role: 'assistant', content: reply });
        } catch (err) {
          appendMessage('bot', '⚠️ Could not connect to the AI backend. Make sure the server is running.');
          statusText.textContent = 'Offline';
          document.getElementById('vc-status-dot').style.background = '#ef4444';
        } finally {
          setLoading(false);
        }
      }

      function appendMessage(role, content) {
        var div = document.createElement('div');
        div.className = 'vc-msg ' + (role === 'user' ? 'vc-msg-user' : 'vc-msg-bot');

        if (role === 'user') {
          div.textContent = content;
        } else {
          div.innerHTML = renderMd(content);
        }

        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
      }

      function setLoading(loading) {
        isLoading = loading;
        input.disabled = loading;
        sendBtn.disabled = loading;

        var existing = document.getElementById('vc-typing');
        if (existing) existing.remove();

        if (loading) {
          var t = document.createElement('div');
          t.id = 'vc-typing';
          t.className = 'vc-typing';
          t.innerHTML = '<span></span><span></span><span></span>';
          messages.appendChild(t);
          messages.scrollTop = messages.scrollHeight;
        }
      }

      // ── Minimal markdown renderer ──
      function esc(s) {
        var d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
      }

      function renderMd(text) {
        if (!text) return '';
        var h = esc(text);
        // Code blocks
        h = h.replace(/```[\w]*\n([\s\S]*?)```/g, '<pre>$1</pre>');
        // Inline code
        h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
        // Headers
        h = h.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
        h = h.replace(/^### (.+)$/gm, '<h3>$1</h3>');
        h = h.replace(/^## (.+)$/gm, '<h2>$1</h2>');
        // Bold & italic
        h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        h = h.replace(/\*([^*]+)\*/g, '<em>$1</em>');
        // Lists
        h = h.replace(/^- (.+)$/gm, '<li>$1</li>');
        h = h.replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>');
        h = h.replace(/<\/ul>\s*<ul>/g, '');
        h = h.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
        // Blockquote
        h = h.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
        // Paragraphs
        h = h.replace(/\n\n+/g, '</p><p>');
        h = h.replace(/\n/g, '<br>');
        if (!h.startsWith('<')) h = '<p>' + h + '</p>';
        return h;
      }

      // ── Health check ──
      fetch('/health').then(function(r) {
        if (r.ok) {
          statusText.textContent = 'Online';
          document.getElementById('vc-status-dot').style.background = '#22c55e';
        }
      }).catch(function() {
        statusText.textContent = 'Connecting…';
        document.getElementById('vc-status-dot').style.background = '#f59e0b';
      });
    })();
    </script>
