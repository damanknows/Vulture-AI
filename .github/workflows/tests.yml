name: Vulture-AI Test & Verification Pipeline

on:
  push:
    branches: [ main, research-v2 ]
  pull_request:
    branches: [ main, research-v2 ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Benchmark Integrity and Provenance Check
        run: |
          python generate_data.py

      - name: Run Offline Unit & Benchmark Tests
        run: |
          PYTHONPATH=. pytest tests/ -m "not integration" -v

      - name: Run End-to-End Reproducibility Pipeline
        run: |
          python experiments/reproduce_all.py

      - name: Verify RAG Guardrail Evaluation
        run: |
          python experiments/evaluate_rag.py
